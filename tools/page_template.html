<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#faf9f7;--surface:#fff;--surface2:#f2f0ec;--border:#e2ded6;--text:#1a1815;
--dim:#5f594f;--faint:#8a8377;--accent:__ACCENT__;--measure:72ch}
@media(prefers-color-scheme:dark){:root{--bg:#14140f;--surface:#1d1d17;--surface2:#25251d;
--border:#33332a;--text:#eeeae1;--dim:#a8a293;--faint:#7d776b;--accent:__ACCENT_DARK__}}
:root[data-theme=dark]{--bg:#14140f;--surface:#1d1d17;--surface2:#25251d;--border:#33332a;
--text:#eeeae1;--dim:#a8a293;--faint:#7d776b;--accent:__ACCENT_DARK__}
:root[data-theme=light]{--bg:#faf9f7;--surface:#fff;--surface2:#f2f0ec;--border:#e2ded6;
--text:#1a1815;--dim:#5f594f;--faint:#8a8377;--accent:__ACCENT__}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
font:17px/1.72 ui-serif,Georgia,"Iowan Old Style",Palatino,serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:min(var(--measure),100%);margin:0 auto;padding:0 22px}
nav.crumb{border-bottom:1px solid var(--border);padding:13px 0;font-size:13.5px;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;position:sticky;top:0;background:var(--bg);z-index:20}
nav.crumb .wrap{max-width:none;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
nav.crumb a{color:var(--dim);text-decoration:none}
nav.crumb a:hover{color:var(--accent)}
nav.crumb .sep{color:var(--faint)}
main{padding:8px 0 80px}
h1{font-size:clamp(28px,5vw,38px);line-height:1.15;letter-spacing:-.015em;margin:34px 0 18px}
h2{font-size:25px;margin:46px 0 14px;letter-spacing:-.01em;padding-bottom:7px;border-bottom:1px solid var(--border)}
h3{font-size:19px;margin:34px 0 10px;color:var(--accent)}
h4{font-size:16px;margin:24px 0 8px;font-family:-apple-system,sans-serif}
p{margin:0 0 16px}
a{color:var(--accent)}
.hash{opacity:0;margin-left:8px;font-weight:400;font-size:.65em;text-decoration:none;color:var(--faint)}
h2:hover .hash,h3:hover .hash{opacity:1}
blockquote{margin:0 0 20px;padding:14px 18px;background:var(--surface2);
border-left:3px solid var(--accent);border-radius:0 8px 8px 0}
blockquote p:last-child{margin-bottom:0}
ol,ul{margin:0 0 18px;padding-left:26px}
li{margin-bottom:8px}
li>ul,li>ol{margin:8px 0 0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.87em;
background:var(--surface2);padding:1px 5px;border-radius:4px}
pre{background:var(--surface2);border:1px solid var(--border);border-radius:9px;
padding:15px 17px;overflow-x:auto;margin:0 0 20px}
pre code{background:none;padding:0;font-size:13px;line-height:1.6}
.tw{overflow-x:auto;margin:0 0 22px;border:1px solid var(--border);border-radius:9px}
table{border-collapse:collapse;width:100%;font-size:15px;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
th,td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top}
th{background:var(--surface2);font-size:12px;text-transform:uppercase;
letter-spacing:.06em;color:var(--dim);font-weight:700;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
hr{border:none;border-top:1px solid var(--border);margin:38px 0}
details{background:var(--surface2);border:1px solid var(--border);border-radius:9px;
padding:13px 17px;margin:0 0 20px}
summary{cursor:pointer;font-weight:600;font-family:-apple-system,sans-serif;font-size:15px}
details[open] summary{margin-bottom:12px}
del{color:var(--faint)}
dl.fields{margin:0 0 20px;padding:0}
dl.fields dt{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);
font-weight:700;margin:14px 0 4px}
dl.fields dt:first-child{margin-top:0}
dl.fields dd{margin:0;font-size:16px;color:var(--dim);line-height:1.62}
dl.fields dd em{color:var(--text)}
dl.fields dt.ru{color:var(--accent)}
dl.fields dd strong{color:var(--text)}
.toc{background:var(--surface2);border:1px solid var(--border);border-radius:10px;
padding:16px 20px;margin:26px 0 34px;font-family:-apple-system,sans-serif;font-size:14px}
.toc b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
color:var(--faint);margin-bottom:9px}
.toc a{display:block;padding:3px 0;color:var(--dim);text-decoration:none}
.toc a:hover{color:var(--accent)}
.themebtn{position:fixed;right:18px;bottom:18px;z-index:60;font-family:-apple-system,sans-serif;
font-size:12.5px;font-weight:600;cursor:pointer;background:var(--surface);border:1px solid var(--border);
border-radius:99px;padding:9px 16px;color:var(--text)}
@media(max-width:600px){body{font-size:16px}.wrap{padding:0 17px}}
</style></head><body>
<nav class="crumb"><div class="wrap">__CRUMB__</div></nav>
<main><div class="wrap">__TOC____BODY__</div></main>
<button class="themebtn" id="themeBtn">Dark</button>
<script>
const tb=document.getElementById('themeBtn');
function setTheme(x){document.documentElement.dataset.theme=x;tb.textContent=x==='dark'?'Light':'Dark';
 try{localStorage.setItem('site-theme',x)}catch(e){}}
tb.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
try{const s=localStorage.getItem('site-theme');
 setTheme(s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}catch(e){setTheme('light')}
</script></body></html>
